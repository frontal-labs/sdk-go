name: Bug report
description: Report a problem with the Frontal Go SDK
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Describe the issue
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: SDK version or source commit
    validations:
      required: true
  - type: textarea
    id: toolchain
    attributes:
      label: Go toolchain and operating system
      description: Paste the output of the version commands in the README.
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have read the Code of Conduct and searched existing issues
          required: true
