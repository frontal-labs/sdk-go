name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (${{ matrix.os }}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.22.x", "1.23.x"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Install Go tools
        run: |
          go install mvdan.cc/gofumpt@v0.7.0
          go install golang.org/x/tools/cmd/goimports@v0.28.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Check formatting
        shell: bash
        run: |
          test -z "$(gofumpt -l .)"
          test -z "$(goimports -l .)"
      - name: Lint
        run: golangci-lint run ./...
      - name: Build
        run: go build ./...
      - name: Test with race detector
        if: matrix.os != 'windows-latest'
        run: go test -race ./...
      - name: Test on Windows
        if: matrix.os == 'windows-latest'
        run: go test ./...
      - name: Run executable examples
        run: go test -run '^Example' ./...
      - name: Check package documentation
        run: |
          go doc github.com/frontal-labs/sdk-go
          go doc github.com/frontal-labs/sdk-go/pkg/resources
      - name: Check API contracts
        if: runner.os == 'Linux'
        run: python3 scripts/check_contracts.py

  conventional-commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Lint commit messages
        run: npx --yes --package @commitlint/cli@19.8.1 commitlint --config commitlint.config.cjs --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
