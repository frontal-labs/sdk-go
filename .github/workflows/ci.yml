name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (${{ matrix.os }}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.22.x", "1.23.x"]
        exclude:
          # Go 1.22's test binaries cannot run on the current macOS ARM64 hosted image.
          - os: macos-latest
            go-version: "1.22.x"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.mod
      - name: Check formatting
        shell: bash
        run: |
          test -z "$(go run mvdan.cc/gofumpt@v0.7.0 -l .)"
          test -z "$(go run golang.org/x/tools/cmd/goimports@v0.28.0 -l .)"
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...
      - name: Build
        run: go build ./...
      - name: Test with race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...
      - name: Test without race detector
        if: matrix.os != 'ubuntu-latest'
        run: go test ./...
      - name: Run executable examples
        run: go test -run '^Example' ./...
      - name: Check package documentation
        run: |
          go doc github.com/frontal-labs/sdk-go
          go doc github.com/frontal-labs/sdk-go/pkg/resources
      - name: Check API contracts
        if: runner.os == 'Linux'
        run: python3 scripts/check_contracts.py

  conventional-commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Lint commit messages
        run: npx --yes --package @commitlint/cli@19.8.1 commitlint --config commitlint.config.cjs --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
