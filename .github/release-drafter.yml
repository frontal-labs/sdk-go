name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE (#$NUMBER)'
version-resolver:
  major:
    labels: [breaking]
  minor:
    labels: [feature, enhancement]
  patch:
    labels: [bug, documentation, chore]
  default: patch
categories:
  - title: Features
    labels: [feature, enhancement]
  - title: Fixes
    labels: [bug]
  - title: Maintenance
    labels: [chore, documentation]
